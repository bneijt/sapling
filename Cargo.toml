[package]
name = "sapling"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive"] }
leptos = { version = "0.7", features = ["ssr"] }
md5 = "0.7"
percent-encoding = "2"
png = "0.17"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tower-http = { version = "0.6", features = ["fs"] }
url = "2"
